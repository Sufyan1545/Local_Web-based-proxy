<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Proxy</title>
<style>
:root{--bar:#1b2430;--field:#0f141b;--ink:#e8edf2;--dim:#8a98a8;--go:#3ddc97;--top:88px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f141b;font-family:system-ui,sans-serif;color:var(--ink)}
body.hide{--top:0px}
button{font-family:inherit}
#top{position:fixed;top:0;left:0;right:0;height:88px;background:var(--bar);z-index:10;transition:transform .2s}
body.hide #top{transform:translateY(-100%)}
#bar{height:52px;display:flex;gap:6px;padding:7px}
#u{flex:1;min-width:0;padding:0 12px;border:1px solid #2c3948;border-radius:8px;background:var(--field);color:var(--ink);font-size:16px}
#u:focus{outline:2px solid var(--go);outline-offset:-1px}
#g{border:0;border-radius:8px;padding:0 16px;background:var(--go);color:#06281a;font-size:16px;font-weight:600}
#r{border:0;border-radius:8px;padding:0 12px;background:#2c3948;color:var(--ink);font-size:18px}
#tabs{height:36px;display:flex;align-items:center;border-top:1px solid #121a24}
#tl{flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 4px}
#tl::-webkit-scrollbar{display:none}
#cnt{flex:1;min-width:0;display:none;padding:0 12px;font-size:13px;color:var(--dim)}
body.gridmode #tl{display:none}
body.gridmode #cnt{display:block}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:2px;width:140px;height:28px;margin:0 3px;padding:0 2px 0 10px;border-radius:8px;background:#26303d;color:var(--dim);font-size:13px;cursor:pointer}
.tab.on{background:var(--field);color:var(--ink);box-shadow:inset 0 -2px 0 var(--go)}
.ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:none;color:inherit;font-size:18px;line-height:1;padding:0 8px}
#nt,#vm{flex:0 0 auto;height:28px;margin:0 3px;padding:0 12px;border:0;border-radius:8px;background:#2c3948;color:var(--ink);font-size:17px}
#vm{margin-right:6px}
#t{position:fixed;top:var(--top);left:50%;transform:translateX(-50%);z-index:11;height:22px;padding:0 22px;border:0;border-radius:0 0 10px 10px;background:var(--bar);color:var(--ink);font-size:12px;opacity:.9;transition:top .2s}

/* pages area */
#frames{position:fixed;top:var(--top);left:0;width:100%;height:calc(100% - var(--top));transition:top .2s,height .2s}
.pane{position:absolute;top:0;left:0;width:100%;height:100%;display:none}
.pane.on{display:block}
.fr{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#fff}
.chead,.cover,.ph{display:none}
.ov{position:absolute;left:0;top:0;width:100%;height:0;border:0;background:#000;z-index:3;display:none}
.ov.show{display:block}
#frames.grid .ov{display:none!important}

/* tab cards (squares) */
#frames.grid{overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px;align-content:start;background:#0f141b}
@media(min-width:700px){#frames.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){#frames.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
#frames.grid .pane{position:relative;display:block;width:auto;height:auto;border-radius:12px;overflow:hidden;background:#fff;border:2px solid #2c3948}
#frames.grid .pane.on{border-color:var(--go)}
#frames.grid .fr{top:34px;transform-origin:0 0;pointer-events:none}
#frames.grid .chead{position:absolute;top:0;left:0;right:0;height:34px;z-index:2;display:flex;align-items:center;gap:4px;padding:0 2px 0 10px;background:var(--bar);color:var(--ink);font-size:13px}
.ctitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx{border:0;background:none;color:inherit;font-size:20px;line-height:1;padding:0 10px;height:100%}
#frames.grid .cover{display:block;position:absolute;top:34px;left:0;right:0;bottom:0;z-index:1;cursor:pointer}
#frames.grid .pane:not(.loaded) .ph{position:absolute;top:34px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;background:#e8edf2;color:#2c3948;font-size:14px;text-align:center;overflow:hidden}
.ph b{font-size:16px;word-break:break-all}
.ph small{color:#6b7886}

#home{position:fixed;top:var(--top);left:0;width:100%;height:calc(100% - var(--top));display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
#home h1{margin:0;font-size:28px;font-weight:600}
#home p{margin:0;color:var(--dim);font-size:15px}
#home .by{margin-top:18px;color:var(--ink);font-size:14px}
body.empty:not(.gridmode) #home{display:flex}
#m{position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:12;max-width:90%;padding:8px 14px;border-radius:8px;background:#5a1f26;color:#fff;font-size:14px;display:none}
</style>
</head>
<body class="empty">
<div id="top">
  <div id="bar">
    <input id="u" type="text" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="رابط أو كلمة بحث">
    <button id="g">Go</button>
    <button id="r" aria-label="إعادة تحميل">⟳</button>
  </div>
  <div id="tabs">
    <div id="tl"></div>
    <div id="cnt"></div>
    <button id="nt" aria-label="تبويب جديد">+</button>
    <button id="vm" aria-label="تبديل عرض التبويبات">▦</button>
  </div>
</div>
<button id="t" aria-label="إخفاء أو إظهار الشريط">▲</button>
<div id="home">
  <h1>Proxy</h1>
  <p>اكتب رابطاً أو كلمة بحث في الشريط بالأعلى</p>
  <p class="by">Created by Sufyan with Claude · v8</p>
</div>
<div id="m"></div>
<div id="frames"></div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var u=$('u'),t=$('t'),m=$('m'),tl=$('tl'),fr=$('frames'),cnt=$('cnt'),vm=$('vm');
  var sid=localStorage.getItem('sid')||'';
  var ready=null, frames={}, panes={}, ovs={}, state=null;
  var view=localStorage.getItem('view')==='grid'?'grid':'strip';
  var HEAD=34, MAXPREVIEW=8;

  function newTab(url){
    return {id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),url:url||'',title:''};
  }
  try{state=JSON.parse(localStorage.getItem('tabs')||'null');}catch(e){state=null;}
  if(!state||!state.tabs||!state.tabs.length){
    var first=newTab(localStorage.getItem('last')||'');
    state={tabs:[first],active:first.id};
  }

  function save(){try{localStorage.setItem('tabs',JSON.stringify(state));}catch(e){}}
  function cur(){
    for(var i=0;i<state.tabs.length;i++) if(state.tabs[i].id===state.active) return state.tabs[i];
    state.active=state.tabs[0].id; return state.tabs[0];
  }
  function say(msg){m.textContent=msg;m.style.display=msg?'block':'none';}
  function api(p){return fetch(p).then(function(r){return r.text()}).then(function(x){return x.trim()});}

  function ensure(){
    if(ready) return ready;
    var check=sid?api('/sessionexists?id='+encodeURIComponent(sid)):Promise.resolve('not found');
    ready=check.then(function(x){
      if(x==='exists') return;
      return api('/newsession').then(function(id){sid=id;localStorage.setItem('sid',id);});
    }).then(function(){
      return api('/editsession?id='+encodeURIComponent(sid)+'&enableShuffling=0');
    }).catch(function(e){ready=null;throw e;});
    return ready;
  }
  function norm(v){
    v=v.trim();
    if(!v) return '';
    if(/^https?:\/\//i.test(v)) return v;
    if(!/\s/.test(v) && /\.[a-z]{2,}(\/|$|:|\?|#)/i.test(v)) return 'https://'+v;
    return 'https://duckduckgo.com/html/?q='+encodeURIComponent(v);
  }
  function host(url){
    try{return new URL(url).hostname.replace(/^www\./,'');}catch(e){return url;}
  }
  function label(tb){
    if(tb.title) return tb.title;
    if(tb.url) return host(tb.url);
    return 'تبويب جديد';
  }
  var ytBase=location.protocol+'//'+location.hostname+':8090';
  function ytId(url){
    try{
      var x=new URL(url), h=x.hostname.replace(/^(www|m|music)\./,''), id='';
      if(h==='youtu.be') id=x.pathname.slice(1).split('/')[0];
      else if(h==='youtube.com'||h==='youtube-nocookie.com'){
        if(x.pathname==='/watch') id=x.searchParams.get('v')||'';
        else{var mm=x.pathname.match(/^\/(live|embed)\/([\w-]{11})/); if(mm) id=mm[2];} /* /shorts/ is left to YouTube's own player */
      }
      return /^[\w-]{11}$/.test(id)?id:'';
    }catch(e){return '';}
  }
  function ytHost(url){
    try{
      var h=new URL(url).hostname.replace(/^(www|m|music)\./,'');
      return h==='youtube.com'||h==='youtu.be'||h==='youtube-nocookie.com';
    }catch(e){return false;}
  }
  var ytUp=null, ytCheckedAt=0;
  function ytAvailable(){
    var now=Date.now();
    if(ytUp===true||(ytUp===false&&now-ytCheckedAt<30000)) return Promise.resolve(ytUp);
    return new Promise(function(res){
      var done=false;
      function fin(v){if(done)return; done=true; clearTimeout(to); ytUp=v; ytCheckedAt=Date.now(); res(v);}
      var to=setTimeout(function(){fin(false);},2500);
      fetch(ytBase+'/',{mode:'no-cors'}).then(function(){fin(true);}).catch(function(){fin(false);});
    });
  }
  function srcFor(tb){
    return '/'+sid+'/'+tb.url;
  }

  /* ---- YouTube: our player is laid exactly over YouTube's own (broken) player area ---- */
  function playerRect(f){
    try{
      var d=f.contentDocument; if(!d) return null;
      var e=d.querySelector('.html5-video-player')||d.querySelector('#player-container-id')||d.querySelector('video');
      if(!e) return null;
      var r=e.getBoundingClientRect();
      if(r.width<100||r.height<60) return null;
      return {l:r.left,t:r.top,w:r.width,h:r.height};
    }catch(x){return null;}
  }
  function quiet(f){
    try{
      var vs=f.contentDocument.getElementsByTagName('video');
      for(var i=0;i<vs.length;i++){ if(!vs[i].paused) vs[i].pause(); vs[i].muted=true; }
    }catch(x){}
  }
  function ytOverlay(tb){
    var p=panes[tb.id], f=frames[tb.id]; if(!p||!f) return;
    var id=ytId(tb.url), o=ovs[tb.id];
    if(!id||ytUp===false){ if(o){o.remove();delete ovs[tb.id];} return; }
    if(!o){
      o=el('iframe','ov');
      o.setAttribute('allow','fullscreen; autoplay; encrypted-media');
      o.setAttribute('allowfullscreen','');
      p.insertBefore(o,p._head);
      ovs[tb.id]=o;
    }
    if(o._vid!==id){ o._vid=id; o.src=ytBase+'/watch?v='+id+'&embed=1'; }
  }
  function track(){
    var W=document.documentElement.clientWidth;
    state.tabs.forEach(function(tb){
      var o=ovs[tb.id], f=frames[tb.id]; if(!o||!f) return;
      quiet(f);
      if(view==='grid'||tb.id!==state.active) return;
      var r=playerRect(f), s=o.style;
      if(r){s.left=r.l+'px';s.top=r.t+'px';s.width=r.w+'px';s.height=r.h+'px';}
      else{s.left='0px';s.top='0px';s.width='100%';s.height=Math.round(W*9/16)+'px';}
      o.classList.add('show');
    });
  }

  /* ---- panes: one per tab (holds the page, and is the card in squares view) ---- */
  function el(tag,cls){var e=document.createElement(tag); if(cls) e.className=cls; return e;}
  function pane(tb){
    if(panes[tb.id]) return panes[tb.id];
    var p=el('div','pane');
    var ph=el('div','ph');
    var h=el('div','chead');
    var tt=el('span','ctitle'); tt.setAttribute('dir','auto');
    var x=el('button','cx'); x.textContent='×'; x.setAttribute('aria-label','إغلاق');
    x.onclick=function(e){e.stopPropagation();closeTab(tb.id);};
    h.appendChild(tt); h.appendChild(x);
    var cv=el('div','cover');
    cv.onclick=function(){select(tb.id);setView('strip');};
    p.appendChild(ph); p.appendChild(h); p.appendChild(cv);
    p._ph=ph; p._title=tt; p._head=h;
    fr.appendChild(p); panes[tb.id]=p;
    return p;
  }
  function updateCards(){
    state.tabs.forEach(function(tb){
      var p=pane(tb);
      p._title.textContent=label(tb);
      p._ph.textContent='';
      var b=el('b'); b.setAttribute('dir','auto'); b.textContent=label(tb);
      p._ph.appendChild(b);
      var s=el('small'); s.textContent=tb.url?(ytHost(tb.url)?'يوتيوب - اضغط للفتح':'اضغط للفتح'):'تبويب فارغ';
      p._ph.appendChild(s);
      p.classList.toggle('on',tb.id===state.active);
    });
    cnt.textContent=state.tabs.length+' تبويب';
  }
  function render(){
    tl.textContent='';
    state.tabs.forEach(function(tb){
      var d=el('div','tab'+(tb.id===state.active?' on':''));
      var s=el('span','ttl'); s.setAttribute('dir','auto'); s.textContent=label(tb);
      var x=el('button','x'); x.textContent='×'; x.setAttribute('aria-label','إغلاق');
      d.onclick=function(){select(tb.id);};
      x.onclick=function(e){e.stopPropagation();closeTab(tb.id);};
      d.appendChild(s); d.appendChild(x); tl.appendChild(d);
      if(tb.id===state.active) tl.scrollLeft=d.offsetLeft-tl.clientWidth/2+d.offsetWidth/2;
    });
    updateCards();
  }
  function mk(tb){
    var p=pane(tb);
    var f=el('iframe','fr');
    f.setAttribute('allow','fullscreen; autoplay; clipboard-write; encrypted-media');
    f.setAttribute('allowfullscreen','');
    f.addEventListener('load',sync);
    p.insertBefore(f,p._head);
    p.classList.add('loaded');
    frames[tb.id]=f;
    if(view==='grid') layoutGrid();
    return f;
  }
  function load(tb){
    var id=ytId(tb.url);
    ensure().then(function(){
      var f=frames[tb.id]||mk(tb);
      f.src=srcFor(tb);
      if(id) ytAvailable().then(function(up){
        if(!up){
          say('مشغّل يوتيوب غير شغّال، فتحت الفيديو عبر البروكسي العادي. شغّل ~/start-proxy.sh بعد bash update.sh');
          setTimeout(function(){say('');},9000);
        } else { state.tabs.forEach(ytOverlay); }
      });
    }).catch(function(){say('تعذر الاتصال بالخادم. تأكد أن Termux يعمل.');});
  }

  /* ---- squares view: scale each live page into its card ---- */
  function layoutGrid(){
    var W=document.documentElement.clientWidth;
    var H=window.innerHeight-(document.body.classList.contains('hide')?0:88);
    state.tabs.forEach(function(tb){
      var p=panes[tb.id]; if(!p) return;
      var cw=p.clientWidth||150, k=cw/W, f=frames[tb.id];
      p.style.height=Math.round(HEAD+H*k+4)+'px';
      if(f){f.style.width=W+'px';f.style.height=H+'px';f.style.transform='scale('+k+')';}
    });
  }
  function clearGrid(){
    state.tabs.forEach(function(tb){
      var p=panes[tb.id]; if(p) p.style.height='';
      var f=frames[tb.id]; if(f){f.style.width='';f.style.height='';f.style.transform='';}
    });
  }
  function loadPreviews(){
    var todo=state.tabs.filter(function(tb){return tb.url&&!frames[tb.id]&&!ytHost(tb.url);}).slice(0,MAXPREVIEW);
    todo.forEach(function(tb,i){
      setTimeout(function(){ if(view==='grid'&&!frames[tb.id]) load(tb); },300*(i+1));
    });
  }
  function setView(v){
    view=v;
    try{localStorage.setItem('view',v);}catch(e){}
    var g=v==='grid';
    document.body.classList.toggle('gridmode',g);
    fr.classList.toggle('grid',g);
    vm.textContent=g?'▭':'▦';
    vm.setAttribute('aria-label',g?'عرض الشريط':'عرض المربعات');
    if(g){updateCards();layoutGrid();loadPreviews();}
    else{clearGrid();}
  }

  function show(){
    var tb=cur();
    state.tabs.forEach(function(x){pane(x);});
    if(tb.url&&!frames[tb.id]) load(tb);
    document.body.classList.toggle('empty',!tb.url);
    if(document.activeElement!==u) u.value=tb.url;
    render(); save();
    if(view==='grid') layoutGrid();
  }
  function select(id){state.active=id;say('');show();}
  function addTab(){
    var tb=newTab(''); state.tabs.push(tb); state.active=tb.id; say('');
    if(view==='grid') setView('strip');
    show(); u.focus();
  }
  function closeTab(id){
    var idx=-1;
    state.tabs.forEach(function(tb,i){if(tb.id===id) idx=i;});
    if(idx<0) return;
    if(frames[id]) delete frames[id];
    if(ovs[id]) delete ovs[id];
    if(panes[id]){panes[id].remove();delete panes[id];}
    state.tabs.splice(idx,1);
    if(!state.tabs.length) state.tabs.push(newTab(''));
    if(state.active===id) state.active=state.tabs[Math.min(idx,state.tabs.length-1)].id;
    show();
  }
  function openUrl(v){
    v=norm(v); if(!v) return;
    var tb=cur(); say('');
    if(view==='grid') setView('strip');
    tb.url=v; tb.title=''; u.value=v;
    if(frames[tb.id]) load(tb);
    show();
  }
  function reload(){
    var tb=cur(); if(!tb.url) return;
    var f=frames[tb.id];
    if(!f){load(tb);return;}
    try{f.contentWindow.location.reload();}
    catch(e){f.src=srcFor(tb);}
  }
  function sync(){
    var ch=false;
    state.tabs.forEach(function(tb){
      var f=frames[tb.id]; if(!f) return;
      try{
        var h=f.contentWindow.location.href, k='/'+sid+'/', i=h.indexOf(k);
        if(i>-1){
          var real=h.slice(i+k.length);
          if(/^https?:\/\//i.test(real)&&real!==tb.url){tb.url=real;ch=true;}
        }
        var ti=f.contentDocument&&f.contentDocument.title;
        if(ti&&ti!==tb.title){tb.title=ti;ch=true;}
      }catch(e){}
    });
    if(ch){
      save(); render();
      if(document.activeElement!==u) u.value=cur().url;
    }
    state.tabs.forEach(ytOverlay);
  }

  $('g').onclick=function(){openUrl(u.value);};
  $('r').onclick=reload;
  $('nt').onclick=addTab;
  vm.onclick=function(){setView(view==='grid'?'strip':'grid');};
  u.addEventListener('keydown',function(e){if(e.key==='Enter'){u.blur();openUrl(u.value);}});
  u.addEventListener('focus',function(){u.select();});
  t.onclick=function(){
    var hidden=document.body.classList.toggle('hide');
    t.textContent=hidden?'▼':'▲';
    if(view==='grid') layoutGrid();
  };
  window.addEventListener('resize',function(){if(view==='grid') layoutGrid();});
  setInterval(sync,1000);
  setInterval(track,100);
  ytAvailable();
  setView(view);
  show();
})();
</script>
</body>
</html>
